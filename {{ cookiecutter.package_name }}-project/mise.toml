echo '--- Run command ---'
echo 'cdk deploy {{ cookiecutter.package_name | slugify }}-dev-infra --exclusively --require-approval never --profile {% raw %}{{{% endraw %}env.AWS_PROFILE_FOR_DEV{% raw %}}}{% endraw %}'
