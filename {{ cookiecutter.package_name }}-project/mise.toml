echo '--- Run command ---'
echo 'cdk diff {{ cookiecutter.package_name | slugify }}-dev-infra --exclusively --method auto --profile {% raw %}{{{% endraw %}env.AWS_PROFILE_FOR_DEV{% raw %}}}{% endraw %}'
cdk diff {{ cookiecutter.package_name | slugify }}-dev-infra --exclusively --method auto --profile {% raw %}{{{% endraw %}env.AWS_PROFILE_FOR_DEV{% raw %}}}{% endraw %}
"""

[tasks."cdk-up-dev-infra-stack"]
description = "🟢 Deploy stack infra of dev, after building the source, checking the layer, and deploying the config (writes to AWS, no approval prompt)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst", "lambda-source-build", "lambda-layer-check-dev", "config-deploy-dev"]
