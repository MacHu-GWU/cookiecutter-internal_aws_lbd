echo '{{ cookiecutter.package_name | slugify }}-dev-infra: https://{{ cookiecutter.aws_region }}.console.aws.amazon.com/cloudformation/home?region={{ cookiecutter.aws_region }}#/stacks/stackinfo?filteringText={{ cookiecutter.package_name | slugify }}-dev-infra&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'cdk synth {{ cookiecutter.package_name | slugify }}-dev-infra --exclusively'
cdk synth {{ cookiecutter.package_name | slugify }}-dev-infra --exclusively
"""

[tasks."cdk-plan-dev-infra-stack"]
description = "🔵 Plan stack infra of dev: diff against what is deployed, through a CloudFormation change set (no deploy)"
dir = "cdk"
env = { ENV_NAME = "dev" }
