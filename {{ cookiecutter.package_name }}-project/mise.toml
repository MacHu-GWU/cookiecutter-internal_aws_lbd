echo 'cdk destroy {{ cookiecutter.package_name | slugify }}-dev-infra --exclusively --force --profile {% raw %}{{{% endraw %}env.AWS_PROFILE_FOR_DEV{% raw %}}}{% endraw %}'
cdk destroy {{ cookiecutter.package_name | slugify }}-dev-infra --exclusively --force --profile {% raw %}{{{% endraw %}env.AWS_PROFILE_FOR_DEV{% raw %}}}{% endraw %}
