# ==============================================================================
# The [project] table defined by Official python.org
#
# Read: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# ==============================================================================
[project]
name = "{{ cookiecutter.package_name }}"
# Increment version before each release - follow `semantic versioning <https://semver.org/>`_
# The single source of the version: the lbd stack reads it into the PACKAGE_VERSION env var of every function.
version = "{{ cookiecutter.version }}"
description = "An example project generated by cookiecutter-internal_aws_lbd."
# Read https://dev-exp-share.readthedocs.io/en/latest/search.html?q=Pick+An+Open+Source+License+For+Python+Project&check_keywords=yes&area=default
# To pick a license and update the ``license``, ``classifier`` field in ``pyproject.toml``
# And also update the ``LICENSE.txt`` file in the git repo.
license = "{{ cookiecutter.license }}"
license-files = ["LICENSE.txt", "AUTHORS.rst"]
authors = [
    { name = "{{ cookiecutter.author }}", email = "{{ cookiecutter.author_email }}" },
]
maintainers = [
    { name = "{{ cookiecutter.author }}", email = "{{ cookiecutter.author_email }}" },
]
keywords = []
readme = "README.rst"
requires-python = ">=3.12,<3.13"
# Full list of classifiers: https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

# ------------------------------------------------------------------------------
# Core Dependencies
# ------------------------------------------------------------------------------
# These are exactly what the Lambda layer contains (``mise run lambda-layer-deploy``),
# so keep dev-only tools (CDK, json5, build tools) out of here.
dependencies = [
    "vislog>=0.1.3,<1.0.0",
    "soft-deps>=0.2.0,<1.0.0",
    "boto3>=1.42.95,<2.0.0",
    "boto-session-manager>=2.1.1,<3.0.0",
    "s3pathlib>=3.0.0,<4.0.0",
    "pydantic>=2.13.3,<3.0.0",
    "aws-lambda-powertools>=3.25.0,<4.0.0", # AWS Lambda Powertools for Python
    "simple-aws-ssm-parameter-store>=0.3.0,<1.0.0", # read the config from SSM in Lambda; write it only when it changed
    # private, from CodeArtifact: each one also has a [tool.uv.sources] line below
    "esc-aws-org-struct>=0.1.1,<1.0.0", # a private package for the demo; replace with your own
]

# ------------------------------------------------------------------------------
# Optional dependency that can be used in ``pip install ${your_project_name}[${feature_name}]``
# Sometime this is also called "extras"
# Read: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#dependencies-optional-dependencies
#
# IMPORTANT: all optional dependencies has to be compatible with the "requires-python" field
# ------------------------------------------------------------------------------
[project.optional-dependencies]

# ------------------------------------------------------------------------------
# Local Development dependenceies
# ------------------------------------------------------------------------------
dev = [
    "rich>=13.8.1,<14.0.0", # pretty print
    "boto3-stubs[cloudformation,s3,lambda,iam,ssm]>=1.42.95,<2.0.0", # Boto3 type stubs, version range should match boto3
    "json5>=0.17.3,<1.0.0", # read config/*.json5
    "aws-cdk-lib>=2.274.0,<3.0.0",
    "cdk-mate>=1.0.1,<2.0.0", # StackCtx of the cdk stack enums
    "simple-aws-lambda>=0.3.1,<1.0.0", # Lambda layer version helpers (cleanup, cross account grant)
    "aws-lbd-art-builder-uv[upload,publish]>=1.0.0,<2.0.0", # Build AWS Lambda deployment package
]

# ------------------------------------------------------------------------------
# (Unit/Coverage/Integration/Load) Test dependenceies
# ------------------------------------------------------------------------------
test = [
    "pytest>=8.2.2,<9.0.0", # Testing framework
    "pytest-cov>=6.0.0,<7.0.0", # Coverage reporting
    "moto>=5.1.21,<6.0.0", # Mock AWS services for testing
]

# ------------------------------------------------------------------------------
# Documentation build dependenceies
# ------------------------------------------------------------------------------
doc = [
    "Sphinx>=7.4.7,<8.0.0",
    "sphinx-copybutton>=0.5.2,<1.0.0", # add copy button to code block
    "sphinx-design>=0.6.1,<1.0.0", # add additional design pattern to sphinx
    "sphinx-jinja>=2.0.2,<3.0.0", # enable jinja syntax in reStructuredText
    "furo==2024.8.6", # the furo sphinx theme
    "pygments>=2.18.0,<3.0.0", # syntax highlight
    "ipython>=8.18.1,<8.19.0", # interactive Python
    "nbsphinx>=0.8.12,<1.0.0", # add jupyter notebook in sphinx doc
    "rstobj==2.0.0", # generate reStructuredText from Python code
    "docfly==3.0.3", # automaticall generate .. toctree directives and API reference doc
]

# ------------------------------------------------------------------------------
# Mise task runner dependencies
# ------------------------------------------------------------------------------
mise = [
    "PyGithub>=2.8.0,<3.0.0", # GitHub API client
]

# Quick Links
[project.urls]
Homepage = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}-project"
Documentation = "https://{{ cookiecutter.package_name | slugify }}.pages.dev"
Repository = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}-project"
Issues = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}-project/issues"
Changelog = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}-project/blob/main/release-history.rst"
Download = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}-project/releases"

# For command line interface, read: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#creating-executable-scripts
[project.scripts]

# ------------------------------------------------------------------------------
# Private index: AWS CodeArtifact
#
# ``explicit = true``: only the packages pinned in [tool.uv.sources] come from this index;
# everything else resolves from PyPI. ``mise run inst`` and ``mise run lambda-layer-*``
# fetch the token (``.mise/tasks/codeartifact-env.sh`` sets UV_INDEX_{{ cookiecutter.aws_codeartifact_domain | upper | replace('-', '_') }}_USERNAME /
# UV_INDEX_{{ cookiecutter.aws_codeartifact_domain | upper | replace('-', '_') }}_PASSWORD), so a bare ``uv sync`` / ``uv lock`` fails on this index.
# Read: https://docs.astral.sh/uv/concepts/indexes/#explicit-indexes
# ------------------------------------------------------------------------------
[[tool.uv.index]]
name = "{{ cookiecutter.aws_codeartifact_domain }}"
url = "https://{{ cookiecutter.aws_codeartifact_domain }}-{{ cookiecutter.devops_aws_account_id }}.d.codeartifact.{{ cookiecutter.aws_region }}.amazonaws.com/pypi/{{ cookiecutter.aws_codeartifact_repository }}/simple/"
authenticate = "always"
explicit = true

# Pin EVERY private package to the index, transitive ones included: uv reads sources only
# from this file, never from a dependency's own pyproject.toml. Each one is also a requirement above.
# Read: https://docs.astral.sh/uv/concepts/indexes/#pinning-a-package-to-an-index
[tool.uv.sources]
esc-aws-org-struct = { index = "{{ cookiecutter.aws_codeartifact_domain }}" }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "{{ cookiecutter.package_name }}*"
]
exclude = [
    "{{ cookiecutter.package_name }}.tests",
    "{{ cookiecutter.package_name }}.tests.*",
    "{{ cookiecutter.package_name }}.docs",
    "{{ cookiecutter.package_name }}.docs.*",
]

[tool.ruff]
extend-exclude = [
    "{{ cookiecutter.package_name }}/vendor",
    ".claude/skills/*/assets", # templates, not valid Python
]

[tool.ruff.lint.per-file-ignores]
# re-export modules
"**/__init__.py" = ["F401"]
"**/api.py" = ["F401"]
"**/lambda_function.py" = ["F401"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
